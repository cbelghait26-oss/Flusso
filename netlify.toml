[build]
  command = "npm install && npm run next:build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Disable smart detection — Firebase web config keys are intentionally public (security via Firestore Rules)
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"
